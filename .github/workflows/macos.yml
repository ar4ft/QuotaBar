name: macOS development build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            app_artifact: QuotaBar-macOS
            preview_artifact: QuotaBar-UI-Previews
          - runner: macos-15-intel
            app_artifact: QuotaBar-macOS-Intel
            preview_artifact: QuotaBar-UI-Previews-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Swift version
        run: xcrun swift --version
      - name: Core tests and app compilation
        run: xcrun swift test
      - name: Verify non-manual signing is rejected
        run: |
          if output="$(GITHUB_ACTIONS=true GITHUB_EVENT_NAME=push ./scripts/build-app.sh --signed 2>&1)"; then
            echo "Automatic signing unexpectedly succeeded." >&2
            exit 1
          fi
          [[ "$output" == *"only for a manually dispatched action"* ]]
      - name: Build development app without certificate signing
        env:
          # Invalid release settings must be ignored in development mode.
          SIGNING_IDENTITY: development-must-ignore-this
          UPDATE_PUBLIC_KEY: development-must-ignore-this
          NOTARY_KEYCHAIN_PROFILE: development-must-ignore-this
        run: ./scripts/build-app.sh --unsigned
      - name: Validate distributable
        run: |
          test -x dist/QuotaBar.app/Contents/MacOS/QuotaBar
          lipo dist/QuotaBar.app/Contents/MacOS/QuotaBar -verify_arch arm64 x86_64
          test -s dist/QuotaBar-macOS.dmg
          test -s dist/QuotaBar.app/Contents/Resources/QuotaBar.icns
          test -f dist/QuotaBar.app/Contents/Frameworks/Sparkle.framework/Sparkle
          test ! -d dist/QuotaBar.app/Contents/_CodeSignature
          binary_signature="$(codesign --display --verbose=4 dist/QuotaBar.app/Contents/MacOS/QuotaBar 2>&1 || true)"
          if [[ "$binary_signature" == *"Authority="* ]]; then
            echo "Development binary unexpectedly has a certificate signature." >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' dist/QuotaBar.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "Development app unexpectedly enables signed updates." >&2
            exit 1
          fi
          otool -L dist/QuotaBar.app/Contents/MacOS/QuotaBar
          unzip -tq dist/QuotaBar-macOS.zip
      - name: Verify startup and main-thread responsiveness
        run: ./scripts/verify-startup.sh
      - name: Publish startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuotaBar-startup-${{ matrix.runner }}
          path: |
            dist/startup.log
            dist/startup-sample.txt
          if-no-files-found: warn
      - name: Verify native account switching with synthetic sessions
        run: dist/QuotaBar.app/Contents/MacOS/QuotaBar --verify-client-switching
      - name: Render native appearance previews
        run: |
          dist/QuotaBar.app/Contents/MacOS/QuotaBar --render-previews dist/previews
          test -s dist/previews/dashboard-light.png
          test -s dist/previews/dashboard-dark.png
          test -s dist/previews/dashboard-high-contrast.png
          test -s dist/previews/dashboard-compact.png
          test -s dist/previews/switch-codex.png
          test -s dist/previews/switch-claude.png
      - name: Publish UI previews
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preview_artifact }}
          path: |
            dist/previews/*.png
            dist/previews/*.json
            dist/QuotaBar-icon.png
          if-no-files-found: error
      - name: Publish macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_artifact }}
          path: |
            dist/QuotaBar-macOS.zip
            dist/QuotaBar-macOS.dmg
          if-no-files-found: error
  publish-development-release:
    name: Publish unsigned development release
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: development-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          name: QuotaBar-macOS
          path: dist
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(python3 - <<'PY'
          import plistlib, re, zipfile
          with zipfile.ZipFile('dist/QuotaBar-macOS.zip') as archive:
              metadata = plistlib.loads(archive.read('QuotaBar.app/Contents/Info.plist'))
          version = metadata['CFBundleShortVersionString']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Packaged app version must be MAJOR.MINOR.PATCH.')
          print(version)
          PY
          )"
          release_tag="v${app_version}-dev.${GITHUB_SHA:0:12}"
          sha256sum dist/QuotaBar-macOS.zip dist/QuotaBar-macOS.dmg | sed 's|dist/||' > dist/SHA256SUMS.txt
          cat > "$RUNNER_TEMP/development-release.md" <<EOF
          Unsigned development build of QuotaBar ${app_version}, for macOS 14 or newer (Apple Silicon and Intel).

          Built from commit ${GITHUB_SHA} after tests, universal packaging, main-thread startup responsiveness on Apple Silicon and Intel, and synthetic account-switching checks passed.

          Download the ZIP or DMG below. These installers have no Developer ID signing or Apple notarization, and do not enable automatic updates. Signed releases are created only through the manually dispatched signed-release workflow.

          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_tag" --jq .sha)"
            [[ "$tagged_commit" == "$GITHUB_SHA" ]] || { echo 'Release tag points to another commit.' >&2; exit 1; }
            gh release upload "$release_tag" dist/QuotaBar-macOS.zip dist/QuotaBar-macOS.dmg dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" dist/QuotaBar-macOS.zip dist/QuotaBar-macOS.dmg dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "QuotaBar ${app_version} development (${GITHUB_SHA:0:7})" \
              --notes-file "$RUNNER_TEMP/development-release.md" --prerelease --latest=false
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag" >> "$GITHUB_STEP_SUMMARY"
